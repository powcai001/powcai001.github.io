title: "powcai"
description: "长期写作｜技术与思考"
url: "https://powcai001.github.io"
baseurl: ""

remote_theme: "mmistakes/minimal-mistakes"
plugins:
  - jekyll-include-cache
  - jekyll-feed  # RSS Feed 插件

# Feed 配置
feed:
  enabled: true
  path: feed.xml

minimal_mistakes_skin: "default"

markdown: kramdown
permalink: /:categories/:title/
paginate: 8
paginate_path: /page:num/

author:
  name: "powcai"
  avatar: "/assets/images/avatar.png"
  bio: "长期写作｜技术与思考"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/powcai001"

# 导航菜单
navigation:
  main:
    - title: "主页"
      url: /
    - title: "Start Here"
      url: /start/
    - title: "博客"
      url: /blog/
    - title: "分类"
      url: /categories/
    - title: "标签"
      url: /tags/
    - title: "归档"
      url: /archive/
    - title: "关于"
      url: /about/

# Footer 配置
footer:
  links:
    - label: "Feed"
      icon: "fas fa-rss-square"
      url: "/feed.xml"

# 版权信息（如果需要自定义）
site_footer_text: "© 2026 powcai. Powered by Jekyll & Minimal Mistakes."

# 分享配置
share: true

# 相关文章配置（You May Also Enjoy）
related: false  # 设置为 false 可禁用相关文章推荐

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: false  # 禁用相关文章推荐
