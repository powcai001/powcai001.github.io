{% if page.share != false %}
<div class="page__share">
  <h4 class="page__share-title">{{ site.data.ui-text[site.locale].share_on_label | default: "Share on" }}</h4>
  
  <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}%20{{ page.url | absolute_url | url_encode }}" 
     class="btn btn--twitter" 
     onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;" 
     title="{{ site.data.ui-text[site.locale].share_on_label | default: 'Share on' }} Twitter">
    <i class="fab fa-x-twitter" aria-hidden="true"></i> <span>X</span>
  </a>

  <a href="javascript:void(0);" 
     class="btn btn--wechat" 
     onclick="showWeChatShare()" 
     title="分享到微信">
    <i class="fab fa-weixin" aria-hidden="true"></i> <span>微信</span>
  </a>
</div>

<!-- 微信分享二维码弹窗 -->
<div id="wechat-share-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center;">
  <div style="background: white; padding: 20px; border-radius: 10px; text-align: center; max-width: 300px;">
    <h3 style="margin-top: 0;">分享到微信</h3>
    <p>请使用微信扫描二维码</p>
    <div id="wechat-qrcode"></div>
    <button onclick="closeWeChatShare()" style="margin-top: 15px; padding: 8px 20px; background: #07c160; color: white; border: none; border-radius: 5px; cursor: pointer;">关闭</button>
  </div>
</div>

<script>
function showWeChatShare() {
  var modal = document.getElementById('wechat-share-modal');
  var qrcodeDiv = document.getElementById('wechat-qrcode');
  
  // 生成二维码（使用在线服务）
  var url = window.location.href;
  var qrcodeUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
  
  qrcodeDiv.innerHTML = '<img src="' + qrcodeUrl + '" alt="微信分享二维码" style="max-width: 200px;">';
  modal.style.display = 'flex';
}

function closeWeChatShare() {
  document.getElementById('wechat-share-modal').style.display = 'none';
}

// 点击外部关闭
document.getElementById('wechat-share-modal').addEventListener('click', function(e) {
  if (e.target === this) {
    closeWeChatShare();
  }
});
</script>

<style>
.btn--wechat {
  background-color: #07c160;
  color: #fff;
}

.btn--wechat:hover {
  background-color: #06ad56;
  color: #fff;
}
</style>
{% endif %}
